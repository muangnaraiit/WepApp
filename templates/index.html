<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบตรวจเช็คอุปกรณ์ IT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #eef3fb;
            margin: 0;
            padding: 12px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 18px;
            border-radius: 16px;
        }

        h2 {
            text-align: center;
            color: #1d4ed8;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }

        input, select, button {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            font-weight: bold;
        }

        .scan-btn {
            background: #16a34a;
        }

        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 10px;
            display: none;
        }

        .found {
            background: #dcfce7;
            color: #166534;
        }

        .new {
            background: #fef9c3;
            color: #854d0e;
        }

        #reader {
            display: none;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            font-size: 13px;
        }

        th, td {
            border: 1px solid #e2e8f0;
            padding: 8px;
        }

        th {
            background: #2563eb;
            color: white;
        }

        @media (max-width: 600px) {
            table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ระบบตรวจเช็คอุปกรณ์ IT</h2>

    <form method="post" action="/save">

        <label>MNH</label>
        <input type="text" name="mnh" id="mnh" required placeholder="สแกนหรือกรอก MNH">
        <button type="button" class="scan-btn" onclick="startScan('mnh')">กดสแกน MNH</button>

        <div id="statusBox" class="status"></div>

        <label>อุปกรณ์</label>
        <select name="device_type" id="device_type" required>
            <option value="">-- เลือกอุปกรณ์ --</option>
            <option value="AIO">AIO</option>
            <option value="PC">PC</option>
            <option value="Monitor">Monitor</option>
            <option value="Printer">Printer</option>
            <option value="Scanner">Scanner</option>
            <option value="UPS">UPS</option>
            <option value="Notebook">Notebook</option>
            <option value="Projector">Projector</option>
        </select>

        <label>รุ่น</label>
        <input type="text" name="model" id="model" list="model_list" placeholder="กรอกรุ่น หรือเลือกจากข้อมูลเดิม">
        <datalist id="model_list">
            {% for m in models %}
                <option value="{{ m.model }}">
            {% endfor %}
        </datalist>

        <label>Serial Number</label>
        <input type="text" name="serial_number" id="serial_number" placeholder="สแกนหรือกรอก Serial Number">
        <button type="button" class="scan-btn" onclick="startScan('serial_number')">กดสแกน Serial Number</button>

        <label>ชื่อเครื่อง</label>
        <input type="text" name="computer_name" id="computer_name" placeholder="เช่น MNH-OPD-001">

        <div id="reader"></div>

        <button type="submit">บันทึก / อัปเดตข้อมูล</button>
    </form>

    <form method="get" action="/">
        <input type="text" name="search" value="{{ search }}" placeholder="ค้นหา MNH / รุ่น / Serial / ชื่อเครื่อง">
        <button type="submit">ค้นหา</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>MNH</th>
                <th>อุปกรณ์</th>
                <th>รุ่น</th>
                <th>Serial</th>
                <th>ชื่อเครื่อง</th>
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
            <tr>
                <td>{{ row.mnh }}</td>
                <td>{{ row.device_type }}</td>
                <td>{{ row.model }}</td>
                <td>{{ row.serial_number }}</td>
                <td>{{ row.computer_name }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
    const mnhInput = document.getElementById("mnh");
    const deviceType = document.getElementById("device_type");
    const modelInput = document.getElementById("model");
    const serialInput = document.getElementById("serial_number");
    const computerNameInput = document.getElementById("computer_name");
    const statusBox = document.getElementById("statusBox");

    let scanner = null;

    function syncSerialNumber() {
        if (deviceType.value === "PC") {
            serialInput.value = mnhInput.value;
            serialInput.readOnly = true;
        } else {
            serialInput.readOnly = false;
        }
    }

    async function loadDeviceByMNH() {
        const mnh = mnhInput.value.trim();

        if (!mnh) return;

        const res = await fetch(`/api/device/${encodeURIComponent(mnh)}`);
        const json = await res.json();

        statusBox.style.display = "block";

        if (json.found) {
            const d = json.data;

            deviceType.value = d.device_type || "";
            modelInput.value = d.model || "";
            serialInput.value = d.serial_number || "";
            computerNameInput.value = d.computer_name || "";

            statusBox.className = "status found";
            statusBox.innerText = "พบข้อมูลเดิม ระบบดึงข้อมูลมาให้แก้ไขแล้ว";
        } else {
            deviceType.value = "";
            modelInput.value = "";
            serialInput.value = "";
            computerNameInput.value = "";

            statusBox.className = "status new";
            statusBox.innerText = "ไม่พบข้อมูลเดิม สามารถเพิ่มข้อมูลใหม่ได้";
        }

        syncSerialNumber();
    }

    async function startScan(inputId) {
        const reader = document.getElementById("reader");
        reader.style.display = "block";

        if (scanner) {
            await scanner.stop().catch(() => {});
            scanner = null;
        }

        scanner = new Html5Qrcode("reader");

        scanner.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: 250
            },
            async function(decodedText) {
                document.getElementById(inputId).value = decodedText;

                await scanner.stop();
                reader.style.display = "none";

                if (inputId === "mnh") {
                    await loadDeviceByMNH();
                }

                syncSerialNumber();
            }
        );
    }

    mnhInput.addEventListener("change", loadDeviceByMNH);
    mnhInput.addEventListener("blur", loadDeviceByMNH);
    mnhInput.addEventListener("input", syncSerialNumber);
    deviceType.addEventListener("change", syncSerialNumber);
</script>

</body>
</html>
